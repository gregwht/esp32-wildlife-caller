<!DOCTYPE html>
<html>
    <head>
        <title>Wildlife Caller</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="container">

            <h1>Wildlife Caller Setup</h1>

            <div id="timeslotsContainer"></div>

            <button type="button" class="add-btn" onclick="addTimeslot()">+ Add Timeslot</button>

            <button onclick="saveSettings()">Save</button>

            <div id="saveMessage"></div>

            <hr>

            <h2>Status</h2>

            <p>
                Current RTC Time:
                <span id ="currentTime">Loading...</span>
            </p>

            <p>Scheduled Timeslots:</p>

            <ul id="statusTimeslots">
                <li>Loading...</li>
            </ul>

            <button onclick="syncRTC()">
                Sync RTC Clock to Current Time
            </button>

            <div id="rtcMessage"></div>

        </div>    

        <script src="script.js"></script>

    </body>
</html>
